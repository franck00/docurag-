name: Deploy (azd)

# Déploiement continu vers Azure via azd, authentifié par OIDC (fédération
# d'identité — aucun secret de service principal dans le repo, J14).
#
# Secrets/variables de dépôt à configurer au préalable :
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  (variables)
#   AZURE_ENV_NAME, AZURE_LOCATION                            (variables)
# La fédération OIDC se met en place avec :
#   azd pipeline config --provider github

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write      # requis pour l'OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with azd (OIDC)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision infrastructure
        run: azd provision --no-prompt

      - name: Deploy services
        run: azd deploy --no-prompt
